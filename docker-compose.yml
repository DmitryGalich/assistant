name: assistant

services:
  model_runner:
    build: model_runner
    container_name: model_runner
    networks:
      - model_network
    ports:
      - "8080:8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # model_handler:
  #   build: model_handler
